name: Laravel CD

on:
  workflow_run:
    workflows: ["Laravel CI"]
    types:
      - completed
    branches:
      - main
      - develop

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            cd /var/www/coffee_shop_system_backend

            echo "Pulling latest code for branch: ${{ github.event.workflow_run.head_branch }}..."
            git fetch origin ${{ github.event.workflow_run.head_branch }}
            git reset --hard origin/${{ github.event.workflow_run.head_branch }}

            echo "Installing Composer dependencies..."
            composer install --no-dev --optimize-autoloader

            echo "Clearing old caches..."
            php artisan optimize:clear

            echo "Running migrations..."
            php artisan migrate --force

            echo "Ensuring JWT secret is set..."
            if ! grep -q "^JWT_SECRET=." .env; then
                php artisan jwt:secret --force
            fi

            echo "Caching Laravel configuration..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "Generating Swagger API documentation..."
            php artisan l5-swagger:generate

            echo "Fixing permissions for storage and cache..."
            sudo chmod -R 777 storage bootstrap/cache

            echo "Deployment completed!"